<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Products Demo</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        table{
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th,td{
            border: 2px solid green;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: royalblue;
            color: white;
        }

        img{
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Sr.No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>QR Code</th>
                <th>Rating</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="data">

        </tbody>
    </table>

    <script>

        const ele = document.getElementById("data");

        const URL = "https://dummyjson.com/products?limit=100&skip=0";

        async function loadProducts(){

            try{

                const response = await fetch(URL);

                const data = await response.json();

                console.log(data.products);

                let row = "";

                data.products.forEach((product,index)=>{

                    row += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${product.title}</td>

                            <td>
                                <img src="${product.thumbnail}" alt="${product.title}">
                            </td>

                            <td>
                                <img src="${product.meta.qrCode}" alt="QR Code">
                            </td>

                            <td>${product.rating}</td>

                            <td>${product.stock}</td>

                        </tr>
                    `;
                });

                ele.innerHTML = row;

            }
            catch(error){
                console.log("Error :",error);
            }

        }

        loadProducts();

    </script>

</body>
</html>
